[project]
name = "maestro-worker-python"
version = "5.2.3"
description = "Utility to run workers on Moises/Maestro"
readme = "README.md"
requires-python = ">=3.11,<3.16"
license = "MIT"
authors = [{ name = "Moises.ai" }]
dependencies = [
  "fastapi>=0.139.2,<1",
  "json-logging>=1.6,<2",
  "nvidia-ml-py>=12.535,<14",
  "psutil>=6.0.0,<8",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.9,<3",
  "requests>=2.31,<3",
  "sentry-sdk[fastapi]>=2,<3",
  "uvicorn>=0.34.0,<1",
]

[project.scripts]
maestro-cli = "maestro_worker_python.cli:main"
maestro-init = "maestro_worker_python.init:main"
maestro-server = "maestro_worker_python.server:main"
maestro-upload-server = "maestro_worker_python.run_upload_server:main"

[dependency-groups]
dev = [
  "httpx2>=2.9.1",
  "pytest>=9.0.3,<10",
  "pytest-httpserver>=1.0.6,<2",
  "ruff>=0.17,<0.18",
  "ty==0.0.90",
]

[build-system]
requires = ["uv_build>=0.11.25,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.uv.build-backend]
module-root = ""
